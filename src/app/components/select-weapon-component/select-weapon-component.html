<hunt-weapon-filters (weaponsChange)="applyFilters($event)"></hunt-weapon-filters>

<div class="equipment-card-list-container">
  @for (weapon of filteredWeapons; track $index) {
  <hunt-equipment-card-component [weapon]="weapon" [active]="selectedWeapon === weapon" [showOptions]="showOptions()"
    (optionSelected)="optionSelected(weapon, $event)" (click)="touchWeapon(weapon)"></hunt-equipment-card-component>
  }
</div>
