@if (utilService.isSmallScreen()) {
<div class="list-item" (click)="isOptionsModalOpen = true">
  <img class="size-icon" src="ammo-icons/ammo_filter-{{weapon().size}}-slot.svg" />
  <img class="ammo-icon" [src]="getAmmoSrc(weapon())" />

  <h4 class="weapon-name">
    {{weapon().name}}
  </h4>

  <img class="weapon-image" [src]="weapon().image" />
</div>

<hunt-modal [title]="weapon().name" [(show)]="isOptionsModalOpen">
  <div class="options-list-container">
    <button class="option-button" (click)="optionSelected.emit(OPTIONS.COMPARE)">
      <span class="material-symbols-outlined">compare_arrows</span>
      <span>
        Compare with another weapon
      </span>
    </button>
    <button class="option-button" (click)="optionSelected.emit(OPTIONS.DETAILS)">
      <span class="material-symbols-outlined">info</span>
      <span>
        See more details
      </span>
    </button>
  </div>
</hunt-modal>
} @else {
<div class="equipment-card" [class.active]="active()" (click)="cardClicked()">
  <img class="weapon-img" [src]="weapon().image">
  <span class="top-left">{{weapon().name}}</span>
  <span class="bottom-left size-icon">
    <img [src]="sizeSrc()">
  </span>
  @if (showOptions()) {
  <span class="top-right">
    <button class="options-button" (click)="toggleOptions($event)" [cdkMenuTriggerFor]="options">
      <span class="material-symbols-outlined">more_vert</span>
    </button>
  </span>
  }
  <span class="bottom-right hunt-dollars">
    <hunt-dollar-icon></hunt-dollar-icon>
    {{weapon().cost}}
  </span>
</div>

<ng-template #options>
  <div class="options-list" cdkMenu>
    <button (click)="optionSelected.emit(OPTIONS.DETAILS)" cdkMenuItem>
      <span class="material-symbols-outlined">info</span>
      <span>Details</span>
    </button>
    <button (click)="optionSelected.emit(OPTIONS.COMPARE)" cdkMenuItem>
      <span class="material-symbols-outlined">compare_arrows</span>
      <span>Compare</span>
    </button>
  </div>
</ng-template>
}
