<hunt-weapon-filters></hunt-weapon-filters>
@if (true) {
<div class="list">
  @for (w of weapons; track $index) {
  <div class="list-item">
    <img class="size-icon" src="ammo-icons/ammo_filter-{{w.size}}-slot.svg" />
    <img class="ammo-icon" [src]="getAmmoSrc(w)" />

    <h4 class="weapon-name">
      {{w.name}}
    </h4>

    <img class="weapon-image" [src]="w.image" />
  </div>
  }
</div>
}
